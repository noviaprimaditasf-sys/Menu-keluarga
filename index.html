<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dapur Keluarga</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config={theme:{extend:{colors:{cream:'var(--bg)',card:'var(--card)',ink:'var(--ink)',muted:'var(--muted)',sage:'var(--sage)',sagel:'var(--sagel)',terra:'var(--terra)',line:'var(--line)',onsage:'var(--onsage)'}}}}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<style>
:root{--bg:#FBF6EC;--card:#FFFFFF;--ink:#2F3A2F;--muted:#6B766B;--sage:#5E7F62;--sagel:#E4EDE2;--terra:#B9603F;--line:#EADFCB;--onsage:#FFFFFF;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1E211C;--card:#2A2E27;--ink:#F1EDE2;--muted:#A9B2A5;--sage:#8DB190;--sagel:#33402F;--terra:#E08A66;--line:#3B4036;--onsage:#1E211C;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1E211C;--card:#2A2E27;--ink:#F1EDE2;--muted:#A9B2A5;--sage:#8DB190;--sagel:#33402F;--terra:#E08A66;--line:#3B4036;--onsage:#1E211C;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;margin:0}
input,select{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:8px 10px;max-width:100%}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--sage);outline-offset:2px}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--sage)}
</style>
</head>
<body>
<div id="root"></div>
<script>
//DATA
const ING={ayam:['Ayam','p','g',40],telur:['Telur ayam','p','butir',2300],kembung:['Ikan kembung','p','g',40],tongkol:['Ikan tongkol','p','g',38],gurame:['Ikan gurame','p','g',48],lele:['Ikan lele','p','g',30],sapi:['Daging sapi','p','g',130],ati:['Ati ampela ayam','p','g',35],tahu:['Tahu putih','p','potong',1500],tempe:['Tempe','p','papan',5000],sarden:['Sarden kaleng','p','kaleng',12000],
bayam:['Bayam','s','ikat',3000],jagung:['Jagung manis','s','buah',4000],oyong:['Oyong','s','g',8],labu:['Labu siam','s','g',7],wortel:['Wortel','s','g',12],buncis:['Buncis','s','g',15],kentang:['Kentang','s','g',17],kol:['Kol','s','g',10],sawiP:['Sawi putih','s','g',10],sawiH:['Sawi hijau','s','g',10],kangkung:['Kangkung','s','ikat',3000],tomat:['Tomat','s','g',15],
kecap:['Kecap manis','b','ml',25],makaroni:['Makaroni','b','g',30],santan:['Santan instan','b','bungkus',3500],tapioka:['Tepung tapioka','b','g',20],rempah:['Rempah segar (kunyit, jahe, lengkuas, serai)','b','paket',4000],cabai:['Cabai merah keriting','b','g',40],dabaw:['Daun bawang & seledri','b','ikat',2500]};
const M=[
{l:'Ayam kecap kentang',s:'Sayur sop',i:{ayam:300,kentang:400,kecap:60,wortel:150,kol:150,dabaw:1},t:50,st:['Tumis bumbu halus dan daun salam sampai harum.','Masukkan ayam, aduk hingga berubah warna. Tambahkan kentang, kecap, dan air, lalu masak 25 menit sampai empuk.','Sop: rebus air dengan bawang putih, masukkan wortel, kentang, dan kol. Beri garam, merica, dan irisan daun bawang.']},
{l:'Telur dadar tahu',s:'Tumis bayam jagung',i:{telur:4,tahu:2,bayam:2,jagung:1},t:25,st:['Hancurkan tahu, campur telur, bawang, garam, dan merica. Dadar sampai matang.','Tumis bawang putih, masukkan jagung sisir lalu bayam. Beri garam, gula, dan sedikit air.']},
{l:'Ikan kembung goreng',s:'Sayur bening oyong',i:{kembung:400,oyong:250},t:30,st:['Lumuri ikan dengan garam, bawang putih halus, dan kunyit. Diamkan 10 menit, lalu goreng sampai matang.','Rebus air dengan irisan bawang, masukkan oyong, garam, dan gula. Angkat saat oyong empuk.']},
{l:'Tempe bacem dan telur rebus',s:'Tumis labu siam',i:{tempe:2,telur:4,kecap:50,labu:350},t:40,st:['Rebus tempe dengan bawang, ketumbar, daun salam, kecap, dan gula sampai bumbu meresap. Goreng sebentar.','Rebus telur 10 menit, lalu kupas.','Tumis bawang, labu siam iris korek api, garam, dan sedikit air sampai empuk.']},
{l:'Sop ayam kentang',s:'Capcay',i:{ayam:250,kentang:200,dabaw:1,wortel:200,kol:150,sawiP:150},t:45,st:['Rebus ayam dengan bawang putih, wortel, dan kentang. Beri garam, merica, dan daun bawang.','Capcay: tumis bawang putih, masukkan wortel, kol, sawi putih, sedikit air, dan garam. Aduk sebentar agar tetap renyah.']},
{l:'Tongkol suwir kecap',s:'Sayur lodeh labu siam',i:{tongkol:350,kecap:50,labu:350,santan:2,rempah:1},t:45,b:'Bawang merah, bawang putih, daun salam, lengkuas, garam, gula',tv:'Lodeh dibuat tanpa cabai sehingga aman untuk balita.',st:['Kukus tongkol sampai matang, suwir, dan buang durinya.','Tumis bawang dan rempah, masukkan tongkol suwir, kecap, garam, dan gula sampai meresap.','Lodeh: rebus labu siam dengan bumbu halus (bawang, kunyit), tuang santan, lalu masak api kecil sampai empuk. Jangan didihkan keras.']},
{l:'Tahu telur saus kecap',s:'Tumis wortel buncis',i:{tahu:3,telur:3,kecap:50,wortel:150,buncis:200},t:30,st:['Goreng tahu dan telur dadar iris. Tumis bawang, tambahkan kecap, air, garam, gula, lalu masukkan tahu dan telur sampai meresap.','Tumis bawang putih, wortel, buncis, garam, dan sedikit air sampai empuk.']},
{l:'Ayam ungkep',s:'Tumis kangkung',i:{ayam:400,rempah:1,kangkung:2},t:50,st:['Ungkep ayam dengan bumbu halus (bawang, kunyit, ketumbar), rempah, dan air selama 30 menit. Goreng sebentar.','Tumis bawang putih dan kangkung dengan garam serta sedikit air. Angkat cepat.']},
{l:'Lele goreng',s:'Sayur bening bayam',i:{lele:400,bayam:2},t:30,st:['Lumuri lele dengan garam dan kunyit, lalu goreng sampai matang.','Rebus air dengan irisan bawang, masukkan bayam dan garam. Angkat saat layu.']},
{l:'Semur daging sapi kentang',s:'Tumis kol wortel',i:{sapi:250,kentang:300,kecap:60,kol:200,wortel:150},t:75,b:'Bawang merah, bawang putih, pala, merica, garam, gula',st:['Rebus daging dalam 600 ml air selama 45 menit sampai empuk.','Tumis bumbu halus, masukkan daging, kecap, dan kentang. Masak sampai kuah menyusut.','Tumis bawang putih, wortel, kol, garam, dan sedikit air.']},
{l:'Orek tempe telur',s:'Sayur sop makaroni',i:{tempe:2,telur:3,kecap:40,makaroni:80,wortel:100,dabaw:1},t:35,st:['Goreng tempe potong dadu, tumis bawang, masukkan tempe dan kecap, lalu tambahkan telur orak-arik.','Rebus makaroni terpisah. Rebus kaldu dan wortel, masukkan makaroni, daun bawang, garam, dan merica.']},
{l:'Ikan gurame bumbu kuning',s:'Tumis sawi putih',i:{gurame:450,rempah:1,sawiP:250},t:50,b:'Bawang merah, bawang putih, kunyit, jahe, serai, garam, gula',tv:'Pilih bagian daging ikan dan periksa durinya sebelum disajikan ke balita.',st:['Goreng gurame setengah matang.','Haluskan bumbu kuning, tumis sampai harum, tuang air, masukkan ikan, lalu masak sampai bumbu meresap.','Tumis bawang putih, sawi putih, garam, dan sedikit air.']},
{l:'Ati ampela balado',s:'Sayur bobor bayam',i:{ati:300,cabai:50,tomat:100,kecap:20,bayam:2,santan:1,jagung:1},t:45,tv:'VERSI TANPA CABAI (balita 3 dan 4 tahun): sebelum sambal dibuat, pisahkan sekitar 1/3 ati ampela yang sudah direbus. Tumis bawang merah, bawang putih, dan tomat tanpa biji, tambahkan 1 sdm kecap dan garam sangat sedikit, lalu masukkan ati ampela potong kecil. Pastikan matang sempurna dan mudah dikunyah.',st:['Rebus ati ampela dengan daun salam dan garam sampai matang, lalu potong kecil. Pisahkan bagian untuk balita.','Versi dewasa: haluskan cabai merah, bawang, dan tomat, tumis sampai harum, lalu masukkan ati ampela dan aduk sampai meresap.','Bobor: rebus bayam dan jagung dengan bumbu bawang, tuang santan dan garam, lalu masak api kecil.']},
{l:'Perkedel tahu telur',s:'Tumis buncis wortel',i:{tahu:3,telur:3,tapioka:50,buncis:200,wortel:150,dabaw:1},t:35,st:['Hancurkan tahu, campur 2 telur, tapioka, daun bawang, bawang putih, garam, dan merica. Bentuk dan celup telur kocok, lalu goreng.','Tumis bawang putih, buncis, wortel, garam, dan sedikit air.']},
{l:'Ayam suwir bumbu kuning',s:'Sayur bening oyong wortel',i:{ayam:300,rempah:1,oyong:250,wortel:100},t:45,b:'Bawang merah, bawang putih, kunyit, jahe, serai, garam, gula',st:['Rebus ayam sampai matang, lalu suwir. Tumis bumbu kuning halus, masukkan ayam, sedikit air, garam, dan gula.','Rebus air dengan bawang putih, wortel, dan oyong. Beri garam.']},
{l:'Sarden tahu',s:'Tumis sawi hijau',i:{sarden:1,tahu:3,tomat:100,sawiH:250},t:25,tv:'Pilih sarden saus tomat (bukan yang pedas) dan periksa durinya.',st:['Tumis bawang dan tomat, masukkan sarden serta tahu goreng, lalu aduk pelan.','Tumis bawang putih, sawi hijau, dan garam.']},
{l:'Telur orak-arik tempe',s:'Sayur sop',i:{telur:4,tempe:2,dabaw:1,wortel:150,kentang:150,kol:150},t:30,st:['Goreng tempe dadu, orak-arik telur dengan daun bawang dan garam, lalu campur.','Sop: rebus bawang putih, wortel, kentang, dan kol dengan garam serta merica.']},
{l:'Ikan kuah kuning',s:'Tumis labu siam',i:{tongkol:400,rempah:1,labu:350},t:40,b:'Bawang merah, bawang putih, kunyit, jahe, serai, garam, gula',st:['Potong tongkol, tumis bumbu kuning halus, tuang air, masukkan ikan, lalu masak 20 menit dengan garam dan gula.','Tumis bawang, labu siam, garam, dan sedikit air.']},
{l:'Bakso ayam homemade',s:'Capcay',i:{ayam:300,tapioka:60,sawiP:150,kol:150,wortel:150},t:50,st:['Haluskan ayam dengan bawang putih, tapioka, es batu, garam, dan merica. Bentuk bulat, lalu rebus sampai mengapung (±10 menit).','Capcay: tumis bawang putih, wortel, kol, sawi putih, garam, dan sedikit air. Aduk cepat.']},
{l:'Tahu dan tempe goreng',s:'Sayur bening bayam jagung',i:{tahu:3,tempe:2,bayam:2,jagung:2},t:30,st:['Bumbui tahu dan tempe dengan bawang putih dan garam, lalu goreng sampai matang.','Rebus air dengan irisan bawang dan jagung. Masukkan bayam, garam, dan gula.']},
{l:'Telur semur',s:'Tumis kangkung jagung',i:{telur:6,kecap:60,kangkung:2,jagung:1},t:35,b:'Bawang merah, bawang putih, pala, merica, garam, gula',st:['Rebus telur, kupas, dan goreng sebentar. Tumis bumbu halus, tambahkan kecap dan air, lalu masukkan telur sampai meresap.','Tumis bawang putih, jagung sisir, kangkung, dan garam.']}
];
//ENDDATA
const {useState,useEffect,useMemo}=React;
const html=htm.bind(React.createElement);
const KEY='dapurkeluarga_v2';
const today=()=>new Date().toISOString().slice(0,10);
const def=()=>({fam:4,budget:1000000,start:today(),plan:M.map((_,i)=>i+1),favs:[],have:{},bought:{},actual:{},subs:{}});
const load=()=>{try{const s=JSON.parse(localStorage.getItem(KEY));return s&&s.plan&&s.plan.length===21?{...def(),...s}:def()}catch(e){return def()}};
const rp=n=>'Rp'+Math.round(n).toLocaleString('id-ID');
const CNT=u=>u!=='g'&&u!=='ml';
const GL={p:'Protein',s:'Sayuran',b:'Bumbu & pelengkap'};
const FISH=['kembung','tongkol','gurame','lele','sarden'],ANI=['ayam','telur','ati','sapi',...FISH];
const DEFB='Bawang merah, bawang putih, garam, merica, gula';
const TIPS=['Hindari cabai dan rasa terlalu pedas.','Perhatikan garam dan gula: secukupnya saja.','Sesuaikan ukuran potongan dengan kemampuan mengunyah anak (kecil atau suwir).','Jika anak menolak suatu bahan, ganti dengan alternatif seperti wortel atau jagung kukus, telur, atau tahu.'];
const fq=(q,u)=>u==='g'&&q>=1000?(q/1000).toFixed(1).replace('.',',')+' kg':q.toLocaleString('id-ID')+' '+u;
const yt=q=>'https://www.youtube.com/results?search_query='+encodeURIComponent(q+' tutorial resep').replace(/%20/g,'+');
const dq=(q,u)=>CNT(u)?Math.ceil(q-1e-9):Math.round(q);

function useShop(S){return useMemo(()=>{const a={};S.plan.forEach(n=>{Object.entries(M[n-1].i).forEach(([id,q])=>{const e=S.subs[n+':'+id]||id;a[e]=(a[e]||0)+q*S.fam/4})});
return Object.entries(a).map(([id,q])=>{const [nm,g,u,pr]=ING[id];q=dq(q,u);const est=q*pr,have=!!S.have[id],bought=!!S.bought[id],ac=S.actual[id];const real=ac!==undefined&&ac!==''?+ac:est;return{id,nm,g,u,q,est,have,bought,ac,proj:have?0:(bought?real:est),paid:bought&&!have?real:0}}).sort((x,y)=>x.nm.localeCompare(y.nm))},[S.plan,S.subs,S.fam,S.have,S.bought,S.actual])}

const Card=({c='',children})=>html`<div className=${'bg-card border border-line rounded-2xl p-4 '+c}>${children}</div>`;
const Chip=({on,f,children})=>html`<button onClick=${f} className=${'px-3 py-1.5 rounded-full text-sm border '+(on?'bg-sage text-onsage border-sage':'bg-card border-line text-ink')}>${children}</button>`;
const Btn=({f,c='',children})=>html`<button onClick=${f} className=${'rounded-xl px-4 py-2.5 font-medium bg-sage text-onsage '+c}>${children}</button>`;
const Bar=({v,max,col='bg-sage'})=>html`<div className="h-2.5 rounded-full bg-sagel overflow-hidden"><div className=${'h-full '+col} style=${{width:Math.min(100,max?v/max*100:0)+'%'}}></div></div>`;
const dateOf=(S,i)=>{const d=new Date(S.start+'T00:00:00');d.setDate(d.getDate()+i);return d.toLocaleDateString('id-ID',{weekday:'short',day:'numeric',month:'short'})};

function Home({S,items,go,ti}){const m=M[S.plan[ti]-1],need=items.filter(x=>!x.have),done=need.filter(x=>x.bought).length,spent=items.reduce((a,x)=>a+x.paid,0),proj=items.reduce((a,x)=>a+x.proj,0);
return html`<div className="space-y-4">
<div><h1 className="text-2xl font-bold">Dapur Keluarga</h1><p className="text-muted text-sm">Rencana menu ${S.fam} orang selama 21 hari</p></div>
<${Card} c="bg-sagel"><div className="text-sm text-muted">Anggaran total</div><div className="text-3xl font-bold">${rp(S.budget)}</div>
<div className="grid grid-cols-3 gap-2 mt-3 text-sm"><div><div className="text-muted">Pengeluaran</div><b>${rp(spent)}</b></div><div><div className="text-muted">Sisa</div><b>${rp(S.budget-spent)}</b></div><div><div className="text-muted">Estimasi belanja</div><b>${rp(proj)}</b></div></div></${Card}>
<${Card}><div className="text-sm text-muted">Menu hari ini · Hari ${ti+1} · ${dateOf(S,ti)}</div><div className="text-lg font-semibold mt-1">${m.l} + ${m.s}</div><div className="text-sm text-muted">Masak ±${m.t} menit · Ramah balita</div><${Btn} c="mt-3" f=${()=>go('detail',ti)}>Lihat resep</${Btn}></${Card}>
<${Card}><div className="flex justify-between text-sm mb-2"><span>Checklist belanja</span><b>${done}/${need.length} barang</b></div><${Bar} v=${done} max=${need.length}/><${Btn} c="mt-3" f=${()=>go('shop')}>Buka daftar belanja</${Btn}></${Card}>
<${Card}><div className="font-semibold mb-1">Catatan untuk balita 3–4 tahun</div><ul className="list-disc pl-5 text-sm space-y-1">${TIPS.slice(0,2).map(t=>html`<li key=${t}>${t}</li>`)}<li>Pastikan ikan bebas duri dan bahan hewani matang sempurna.</li></ul></${Card}></div>`}

function Cal({S,setS,go,ti}){const [q,setQ]=useState(''),[fv,setFv]=useState(false);
const rows=S.plan.map((n,i)=>({n,i,m:M[n-1]})).filter(r=>(!fv||S.favs.includes(r.n))&&(r.m.l+' '+r.m.s).toLowerCase().includes(q.toLowerCase()));
return html`<div className="space-y-3"><h1 className="text-xl font-bold">Kalender menu 21 hari</h1>
<div className="flex gap-2 items-center"><input className="flex-1 min-w-0" placeholder="Cari menu…" value=${q} onChange=${e=>setQ(e.target.value)}/><${Chip} on=${fv} f=${()=>setFv(!fv)}>★ Favorit</${Chip}></div>
${rows.length===0&&html`<p className="text-muted text-sm">Tidak ada menu yang cocok. Ubah kata kunci atau matikan filter favorit.</p>`}
${rows.map(({n,i,m})=>html`<button key=${i} onClick=${()=>go('detail',i)} className=${'w-full text-left bg-card border rounded-2xl p-3 flex gap-3 items-center '+(i===ti?'border-terra':'border-line')}>
<div className="w-12 text-center shrink-0"><div className="text-xs text-muted">Hari</div><div className="text-xl font-bold text-sage">${i+1}</div></div>
<div className="flex-1 min-w-0"><div className="font-medium">${m.l}</div><div className="text-sm text-muted">${m.s}</div><div className="text-xs text-muted mt-0.5">${dateOf(S,i)} · ${m.t} mnt${i===ti?' · hari ini':''}</div></div>
<div className="text-terra">${S.favs.includes(n)?'★':''}</div></button>`)}</div>`}

function Detail({S,setS,d,go}){const n=S.plan[d],m=M[n-1],f=S.fam/4;
const rows=Object.entries(m.i).map(([k,q])=>{const id=S.subs[n+':'+k]||k,[nm,g,u,pr]=ING[id],x=dq(q*f,u);return{k,id,nm,u,x,cost:x*pr}});
const cost=rows.reduce((a,r)=>a+r.cost,0),fav=S.favs.includes(n),has=t=>rows.some(r=>t.includes(r.id));
const tips=[...TIPS.slice(0,1),...(has(FISH)?['Pastikan ikan bebas duri sebelum disajikan.']:[]),...(has(ANI)?['Pastikan bahan hewani matang sempurna.']:[]),...TIPS.slice(1)];
const sub=(k,v)=>setS(p=>({...p,subs:{...p.subs,[n+':'+k]:v}}));
return html`<div className="space-y-4"><button onClick=${()=>go('cal')} className="text-sm text-sage">← Kembali ke kalender</button>
<div className="flex justify-between gap-2"><div><div className="text-sm text-muted">Hari ${d+1} · ${dateOf(S,d)}</div><h1 className="text-xl font-bold">${m.l}</h1><div className="text-lg">+ ${m.s}</div></div>
<button aria-label="Favorit" onClick=${()=>setS(p=>({...p,favs:fav?p.favs.filter(x=>x!==n):[...p.favs,n]}))} className="text-2xl text-terra self-start">${fav?'★':'☆'}</button></div>
<div className="flex gap-2 flex-wrap text-sm"><span className="px-3 py-1 rounded-full bg-sagel">Ramah balita</span><span className="px-3 py-1 rounded-full bg-sagel">${m.t} menit</span><span className="px-3 py-1 rounded-full bg-sagel">Estimasi ${rp(cost)}</span></div>
<div className="grid grid-cols-2 gap-2"><a className="text-center rounded-xl py-2.5 bg-terra text-white font-medium text-sm px-2" target="_blank" rel="noopener noreferrer" href=${yt(m.l)}>▶ Tutorial ${m.l}</a><a className="text-center rounded-xl py-2.5 bg-terra text-white font-medium text-sm px-2" target="_blank" rel="noopener noreferrer" href=${yt(m.s)}>▶ Tutorial ${m.s}</a></div>
${m.tv&&html`<${Card} c="border-terra"><div className="font-semibold text-terra mb-1">Untuk balita</div><p className="text-sm">${m.tv}</p></${Card}>`}
<${Card}><div className="font-semibold mb-2">Bahan untuk ${S.fam} orang</div>${rows.map(r=>{const o=Object.keys(ING).filter(x=>ING[x][1]===ING[r.k][1]&&ING[x][2]===ING[r.k][2]);return html`<div key=${r.k} className="flex items-center justify-between gap-2 py-1.5 border-b border-line last:border-0 text-sm"><select aria-label="Ganti bahan" value=${r.id} onChange=${e=>sub(r.k,e.target.value)} className="min-w-0 flex-1">${o.map(x=>html`<option key=${x} value=${x}>${ING[x][0]}</option>`)}</select><div className="text-right shrink-0"><b>${fq(r.x,r.u)}</b><div className="text-xs text-muted">${rp(r.cost)}</div></div></div>`})}
<p className="text-xs text-muted mt-2">Bumbu dasar: ${m.b||DEFB}</p></${Card}>
<${Card}><div className="font-semibold mb-2">Langkah memasak</div><ol className="list-decimal pl-5 space-y-2 text-sm">${m.st.map(s=>html`<li key=${s}>${s}</li>`)}</ol></${Card}>
<${Card}><div className="font-semibold mb-1">Catatan balita</div><ul className="list-disc pl-5 text-sm space-y-1">${tips.map(t=>html`<li key=${t}>${t}</li>`)}</ul></${Card}>
<${Card}><label className="text-sm font-semibold block mb-1">Ganti menu hari ini</label><select className="w-full" value=${n} onChange=${e=>setS(p=>{const pl=[...p.plan];pl[d]=+e.target.value;return{...p,plan:pl}})}>${M.map((x,i)=>html`<option key=${i} value=${i+1}>${i+1}. ${x.l} + ${x.s}</option>`)}</select></${Card}></div>`}

function Shop({S,setS,items}){const [hide,setHide]=useState(false);
const tg=(f,id)=>setS(p=>({...p,[f]:{...p[f],[id]:!p[f][id]}}));
return html`<div className="space-y-4"><h1 className="text-xl font-bold">Daftar belanja</h1><div className="flex gap-2"><${Chip} on=${hide} f=${()=>setHide(!hide)}>Sembunyikan yang sudah dibeli</${Chip}></div>
${['p','s','b'].map(g=>{const li=items.filter(x=>x.g===g),sub=li.reduce((a,x)=>a+(x.have?0:x.est),0);return html`<${Card} key=${g}><div className="flex justify-between mb-1"><b>${GL[g]}</b><b className="text-sage">${rp(sub)}</b></div>
${li.filter(x=>!(hide&&x.bought)).map(x=>html`<div key=${x.id} className=${'py-2 border-b border-line last:border-0 '+(x.have?'opacity-50':'')}>
<div className="flex items-center gap-3"><input type="checkbox" aria-label=${'Sudah beli '+x.nm} checked=${x.bought} disabled=${x.have} onChange=${()=>tg('bought',x.id)}/>
<div className=${'flex-1 min-w-0 '+(x.bought?'line-through text-muted':'')}><div className="text-sm font-medium">${x.nm}</div><div className="text-xs text-muted">${fq(x.q,x.u)} · est. ${rp(x.est)}</div></div>
<button onClick=${()=>tg('have',x.id)} className=${'text-xs rounded-full px-2.5 py-1 border '+(x.have?'bg-sagel border-sage':'border-line')}>${x.have?'Ada di rumah':'Sudah ada?'}</button></div>
${x.bought&&!x.have&&html`<div className="flex items-center gap-2 mt-1.5 ml-9 text-xs">Harga aktual Rp<input type="number" inputMode="numeric" min="0" className="w-28" placeholder=${String(x.est)} value=${x.ac??''} onChange=${e=>setS(p=>({...p,actual:{...p.actual,[x.id]:e.target.value}}))}/></div>`}</div>`)}</${Card}>`})}</div>`}

function Budget({S,items}){const spent=items.reduce((a,x)=>a+x.paid,0),proj=items.reduce((a,x)=>a+x.proj,0),pct=proj/S.budget*100;
const gs=['p','s','b'].map(g=>({g,v:items.filter(x=>x.g===g).reduce((a,x)=>a+x.proj,0)})),col={p:'bg-terra',s:'bg-sage',b:'bg-line'};
return html`<div className="space-y-4"><h1 className="text-xl font-bold">Anggaran</h1>
${pct>100?html`<${Card} c="border-terra"><b className="text-terra">Melewati anggaran</b><p className="text-sm">Estimasi belanja melebihi anggaran sebesar ${rp(proj-S.budget)}. Ganti menu atau bahan yang mahal.</p></${Card}>`:pct>=90?html`<${Card} c="border-terra"><b className="text-terra">Mendekati batas anggaran</b><p className="text-sm">Estimasi sudah ${Math.round(pct)}% dari anggaran. Sisa ${rp(S.budget-proj)}.</p></${Card}>`:null}
<${Card}><div className="flex justify-between text-sm mb-2"><span>Estimasi belanja</span><b>${rp(proj)} / ${rp(S.budget)}</b></div><${Bar} v=${proj} max=${S.budget} col=${pct>100?'bg-terra':'bg-sage'}/>
<div className="grid grid-cols-2 gap-3 mt-3 text-sm"><div><div className="text-muted">Sudah dibelanjakan</div><b>${rp(spent)}</b></div><div><div className="text-muted">Sisa anggaran</div><b>${rp(S.budget-spent)}</b></div></div></${Card}>
<${Card}><div className="font-semibold mb-2">Pembagian anggaran</div><div className="flex h-5 rounded-full overflow-hidden bg-sagel">${gs.map(x=>html`<div key=${x.g} className=${col[x.g]} style=${{width:(proj?x.v/proj*100:0)+'%'}}></div>`)}</div>
<div className="mt-3 space-y-1.5 text-sm">${gs.map(x=>html`<div key=${x.g} className="flex items-center justify-between"><span className="flex items-center gap-2"><i className=${'inline-block w-3 h-3 rounded-full '+col[x.g]}></i>${GL[x.g]}</span><span>${rp(x.v)} (${proj?Math.round(x.v/proj*100):0}%)</span></div>`)}</div></${Card}>
<p className="text-xs text-muted">Pengeluaran dihitung dari barang yang dicentang di daftar belanja, memakai harga aktual jika diisi. Bahan yang ditandai sudah ada di rumah tidak dihitung.</p></div>`}

function Settings({S,setS,items}){const [rs,setRs]=useState(false);const p=(k,v)=>setS(o=>({...o,[k]:v}));
return html`<div className="space-y-4"><h1 className="text-xl font-bold">Pengaturan</h1>
<${Card} c="space-y-3 text-sm"><label className="flex items-center justify-between gap-3">Jumlah anggota keluarga<input type="number" min="1" max="12" className="w-20" value=${S.fam} onChange=${e=>p('fam',Math.max(1,Math.min(12,+e.target.value||1)))}/></label>
<label className="flex items-center justify-between gap-3">Anggaran (Rp)<input type="number" min="0" step="10000" className="w-36" value=${S.budget} onChange=${e=>p('budget',Math.max(0,+e.target.value||0))}/></label>
<label className="flex items-center justify-between gap-3">Tanggal mulai<input type="date" value=${S.start} onChange=${e=>e.target.value&&p('start',e.target.value)}/></label></${Card}>
<${Card}><div className="font-semibold mb-1">Bahan yang sudah ada di rumah</div><p className="text-xs text-muted mb-2">Bahan terpilih dikurangi dari daftar belanja dan anggaran.</p><div className="flex flex-wrap gap-2">${items.map(x=>html`<${Chip} key=${x.id} on=${x.have} f=${()=>setS(o=>({...o,have:{...o.have,[x.id]:!o.have[x.id]}}))}>${x.nm.split(' (')[0]}</${Chip}>`)}</div></${Card}>
<${Card}><p className="text-sm mb-2">Menu, bahan, favorit, centang belanja, dan harga tersimpan otomatis di perangkat ini.</p>${rs?html`<${Btn} c="!bg-terra" f=${()=>{setS(def());setRs(false)}}>Ya, hapus semua data</${Btn}>`:html`<${Btn} f=${()=>setRs(true)}>Reset data</${Btn}>`}</${Card}></div>`}

function App(){const [S,setS]=useState(load),[v,setV]=useState({v:'home',d:0});
useEffect(()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},[S]);
useEffect(()=>{window.scrollTo(0,0)},[v]);
const items=useShop(S),ti=Math.max(0,Math.min(20,Math.floor((new Date(today())-new Date(S.start))/864e5)));
const go=(x,d=0)=>setV({v:x,d});
const nav=[['home','🏠','Beranda'],['cal','📅','Menu'],['shop','🛒','Belanja'],['budget','💰','Anggaran'],['set','⚙️','Atur']];
const page=v.v==='home'?html`<${Home} S=${S} items=${items} go=${go} ti=${ti}/>`:v.v==='cal'?html`<${Cal} S=${S} setS=${setS} go=${go} ti=${ti}/>`:v.v==='detail'?html`<${Detail} S=${S} setS=${setS} d=${v.d} go=${go}/>`:v.v==='shop'?html`<${Shop} S=${S} setS=${setS} items=${items}/>`:v.v==='budget'?html`<${Budget} S=${S} items=${items}/>`:html`<${Settings} S=${S} setS=${setS} items=${items}/>`;
return html`<div className="max-w-md mx-auto px-4 pt-5 pb-28">${page}</div>
<nav className="fixed bottom-0 inset-x-0 bg-card border-t border-line" style=${{paddingBottom:'env(safe-area-inset-bottom,0px)'}}><div className="max-w-md mx-auto grid grid-cols-5">${nav.map(([k,i,l])=>html`<button key=${k} onClick=${()=>go(k)} className=${'py-2 text-xs '+((v.v===k||(k==='cal'&&v.v==='detail'))?'text-sage font-bold':'text-muted')}><div className="text-lg">${i}</div>${l}</button>`)}</div></nav>`}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
</html>
